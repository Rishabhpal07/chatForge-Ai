[project]
name = "chatforge-ai-server"
version = "0.1.0"
description = "ChatForge AI data plane: ingestion, embeddings, pgvector retrieval, streaming RAG."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "asyncpg>=0.30",
  "pyjwt>=2.9",
  "boto3>=1.35",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "trafilatura>=1.12",
  "crawl4ai>=0.5",
  "fastembed>=0.4",
  "tiktoken>=0.8",
  "arq>=0.26",
  "redis>=5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
